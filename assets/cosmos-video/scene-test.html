<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ===== 帧驱动：由外部传 frame 参数，逐帧确定性渲染 =====
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const W = canvas.width, H = canvas.height;

const params = new URLSearchParams(location.search);
const FPS = parseFloat(params.get('fps') || '30');
const DUR = parseFloat(params.get('dur') || '3');
const TOTAL = Math.round(FPS * DUR);

// ---- 确定性伪随机（同一帧永远同一结果）----
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(20261002);

// ---- 星空（固定星点，只闪烁不打乱）----
const STARS = [];
for (let i = 0; i < 420; i++) {
  STARS.push({
    x: rnd() * W,
    y: rnd() * H,
    r: 0.6 + rnd() * 1.9,
    base: 0.25 + rnd() * 0.6,
    ph: rnd() * Math.PI * 2,
    sp: 0.4 + rnd() * 2.2,
  });
}

function easeOut(t){ return 1 - Math.pow(1 - t, 3); }
function clamp01(t){ return t < 0 ? 0 : t > 1 ? 1 : t; }
function seg(t, a, b){ return clamp01((t - a) / (b - a)); }

function drawStars(t) {
  for (const s of STARS) {
    const tw = 0.65 + 0.35 * Math.sin(t * s.sp * Math.PI * 2 + s.ph);
    ctx.globalAlpha = s.base * tw;
    ctx.fillStyle = '#cfe0ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawVignette() {
  const g = ctx.createRadialGradient(W/2, H/2, H*0.25, W/2, H/2, H*0.95);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function centerText(text, y, size, alpha, color, weight) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color || '#ffffff';
  ctx.font = (weight || 700) + ' ' + size + 'px "Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(190,205,255,0.55)';
  ctx.shadowBlur = size * 0.22;
  ctx.fillText(text, W/2, y);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// ---- 逐帧渲染 ----
window.renderFrame = function (frame) {
  const t = frame / FPS;              // 秒
  const p = frame / (TOTAL - 1);      // 0..1 总进度

  // 深空背景（带极缓的色相漂移）
  const bg = ctx.createLinearGradient(0, 0, W * 0.4, H);
  const shift = Math.sin(p * Math.PI) * 8;
  bg.addColorStop(0, 'rgb(' + (6 + shift) + ',' + (7 + shift) + ',' + (18 + shift * 1.6) + ')');
  bg.addColorStop(0.55, 'rgb(' + (10 + shift) + ',' + (8 + shift) + ',' + (26 + shift) + ')');
  bg.addColorStop(1, 'rgb(4,5,13)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  drawStars(t);

  // 阶段 1: 0.0-0.9s 小标题淡入
  const a1 = seg(t, 0.05, 0.9);
  if (a1 > 0) centerText('世界上活着的人', H * 0.33, 54, easeOut(a1) * 0.85, '#b9c4e8', 400);

  // 阶段 2: 0.5-1.6s 大数字从大缩到正常 + 淡入
  const a2 = seg(t, 0.5, 1.6);
  if (a2 > 0) {
    const e = easeOut(a2);
    const scale = 1.35 - 0.35 * e;
    ctx.save();
    ctx.translate(W/2, H * 0.52);
    ctx.scale(scale, scale);
    ctx.globalAlpha = e;
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 210px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(220,215,255,0.85)';
    ctx.shadowBlur = 70;
    ctx.fillText('70 亿', 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // 阶段 3: 1.3s 起底部字幕
  const a3 = seg(t, 1.3, 2.2);
  if (a3 > 0) centerText('世界上活着的人，有 70 亿', H * 0.86, 56, a3, '#ffffff', 600);

  drawVignette();

  // 左上角标识
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#dfe6ff';
  ctx.font = '400 34px "Segoe UI",sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('DSH', 70, 56);
  ctx.globalAlpha = 1;
};

window.TOTAL_FRAMES = TOTAL;
window.READY = true;
</script>
</body>
</html>
